<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1120" />
  <title>Autohra — City Drift</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(10, 18, 28, 0.7);
      --cyan: #64d9ff;
      --lime: #baff66;
      --white: #edf7ff;
      --muted: #9aa9b6;
      --danger: #ff6e7f;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1120;
      color: var(--white);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }

    #game { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      flex-direction: column;
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 900;
      text-shadow: 0 0 20px rgba(100, 217, 255, 0.35);
    }

    .title b {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .stats {
      display: flex;
      gap: 8px;
    }

    .stat {
      min-width: 74px;
      text-align: center;
      padding: 9px 10px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }

    .stat strong {
      display: block;
      font-size: 20px;
      line-height: 1;
    }

    .stat small {
      display: block;
      margin-top: 5px;
      letter-spacing: 0.12em;
      font-size: 9px;
      color: var(--muted);
    }

    .tiltBtn {
      pointer-events: auto;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(10,18,28,.72);
      color: white;
      font-size: 18px;
      width: 54px;
      height: 54px;
      box-shadow: 0 10px 20px rgba(0,0,0,.22);
    }

    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .tip {
      max-width: 220px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(15, 24, 35, 0.72);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 11px;
      line-height: 1.45;
      color: #dfeaf5;
      backdrop-filter: blur(10px);
    }

    .tip b { color: var(--lime); }

    .controls {
      pointer-events: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .steer {
      display: flex;
      gap: 6px;
    }

    .control, .pedal {
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(18, 29, 42, 0.7);
      color: white;
      border-radius: 16px;
      box-shadow: 0 10px 18px rgba(0,0,0,.23);
      touch-action: none;
      user-select: none;
    }

    .control {
      width: 52px;
      height: 52px;
      font-size: 22px;
      font-weight: 900;
    }

    .control.active, .pedal.active {
      border-color: rgba(100, 217, 255, 0.8);
      background: rgba(100, 217, 255, 0.12);
      transform: scale(0.97);
    }

    .pedal {
      width: 62px;
      height: 64px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .pedal .icon { font-size: 22px; }
    .pedal.gas { border-color: rgba(100,217,255,.5); }
    .pedal.brake { border-color: rgba(255,110,127,.5); }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(6,15,25,.28), rgba(6,15,25,.78));
      transition: opacity .22s ease, visibility .22s ease;
      z-index: 999;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .panel {
      width: min(430px, calc(100vw - 28px));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 26px;
      background: rgba(10,18,28,.85);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      padding: 26px 22px 20px;
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: var(--cyan);
    }

    h1 {
      margin: 13px 0 12px;
      font-size: clamp(36px, 9vw, 58px);
      line-height: .94;
      letter-spacing: -0.06em;
    }

    .panel p {
      margin: 0 auto 18px;
      max-width: 300px;
      font-size: 14px;
      line-height: 1.55;
      color: #d7e1eb;
    }

    .button-row {
      display: grid;
      gap: 10px;
    }

    .primary, .secondary {
      width: 100%;
      border-radius: 14px;
      border: none;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    .primary {
      background: var(--lime);
      color: #0d1823;
    }

    .secondary {
      background: rgba(255,255,255,.06);
      color: #eef7ff;
      border: 1px solid rgba(255,255,255,.14);
    }

    .smalltext {
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .title { font-size: 10px; }
      .title b { font-size: 14px; }
      .stat { min-width: 64px; padding: 8px 8px; }
      .stat strong { font-size: 17px; }
      .tip { max-width: 170px; font-size: 10px; }
      .control { width: 46px; height: 46px; }
      .pedal { width: 56px; height: 58px; font-size: 9px; }
      .tiltBtn { width: 48px; height: 48px; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div class="hud">
    <div class="top">
      <div class="title">CITY DRIFT <b>BEAM-STYLE</b></div>
      <div class="stats">
        <div class="stat"><strong id="speed">0</strong><small>KM/H</small></div>
        <div class="stat"><strong id="distance">0.0</strong><small>KM</small></div>
      </div>
      <button class="tiltBtn" id="tiltBtn" aria-label="Nakláňanie telefónu">📱</button>
    </div>

    <div class="bottom">
      <div class="tip" id="tip"><b>TIP:</b> Nakláňaj telefónom na zatáčanie. Plyn a brzdu máš pod prstami.</div>
      <div class="controls">
        <div class="steer">
          <button class="control" data-steer="-1" aria-label="Vľavo">◀</button>
          <button class="control" data-steer="1" aria-label="Vpravo">▶</button>
        </div>
        <button class="pedal brake" data-pedal="brake" aria-label="Brzda"><span class="icon">▼</span>BRZDA</button>
        <button class="pedal gas" data-pedal="gas" aria-label="Plyn"><span class="icon">▲</span>PLYN</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="eyebrow">3D MESTSKÁ HRA</div>
      <h1 id="gameTitle">Štartuj<br>do mesta.</h1>
      <p id="gameText">Veľký mestský blok, premávka, budovy a rýchla jazda. Na mobile nakláňaj telefónom alebo používaš šípky.</p>
      <div class="button-row">
        <button class="primary" id="startBtn">ŠTART</button>
        <button class="secondary" id="tiltEnableBtn">📱 Zapnúť nakláňanie</button>
      </div>
      <div class="smalltext">Počítač: WASD / šípky • Plyn: W / ↑ • Brzda: S / ↓</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const mount = document.getElementById('game');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const tiltEnableBtn = document.getElementById('tiltEnableBtn');
    const tiltBtn = document.getElementById('tiltBtn');
    const speedEl = document.getElementById('speed');
    const distanceEl = document.getElementById('distance');
    const tipEl = document.getElementById('tip');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9cc9de);
    scene.fog = new THREE.Fog(0x9cc9de, 40, 190);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    mount.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xeaf6ff, 0x556e4c, 2.3);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4d4, 2.8);
    sun.position.set(-22, 38, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -48;
    sun.shadow.camera.right = 48;
    sun.shadow.camera.top = 48;
    sun.shadow.camera.bottom = -48;
    scene.add(sun);

    const world = new THREE.Group();
    scene.add(world);

    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x2b3138, roughness: 0.92, metalness: 0.1 });
    const sidewalkMaterial = new THREE.MeshStandardMaterial({ color: 0x8f9aa3, roughness: 0.92 });
    const laneMaterial = new THREE.MeshStandardMaterial({ color: 0xf3efe0, emissive: 0x131313, roughness: 0.7 });
    const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x5e8f5a, roughness: 1 });
    const buildingMaterial = new THREE.MeshStandardMaterial({ color: 0xd9dce0, roughness: 0.88, metalness: 0.2 });
    const accentMaterial = new THREE.MeshStandardMaterial({ color: 0x3bb7d4, roughness: 0.5, metalness: 0.5 });

    function addRoad(x, z, w, d) {
      const road = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), roadMaterial);
      road.position.set(x, 0.02, z);
      road.receiveShadow = true;
      world.add(road);

      const left = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, 0.22), sidewalkMaterial);
      left.position.set(x, 0.09, z + d * 0.5 - 0.2);
      world.add(left);

      const right = left.clone();
      right.position.z = z - d * 0.5 + 0.2;
      world.add(right);

      for (let i = -2; i <= 2; i++) {
        const dash = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.02, 0.5), laneMaterial);
        dash.position.set(x, 0.08, z + i * 5.2);
        world.add(dash);
      }
    }

    function addCrossRoad(x, z, w, d) {
      const road = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), roadMaterial);
      road.position.set(x, 0.02, z);
      road.receiveShadow = true;
      world.add(road);

      for (let i = -2; i <= 2; i++) {
        const dash = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 2.2), laneMaterial);
        dash.position.set(x + i * 5.2, 0.08, z);
        world.add(dash);
      }
    }

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), grassMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    ground.receiveShadow = true;
    world.add(ground);

    // city network
    for (let z = -120; z <= 120; z += 24) {
      addRoad(0, z, 18, 12);
    }
    for (let x = -36; x <= 36; x += 24) {
      addCrossRoad(x, 0, 12, 18);
    }

    const buildingBlocks = [];
    for (let ix = -2; ix <= 2; ix++) {
      for (let iz = -6; iz <= 6; iz++) {
        const x = ix * 25 + (ix >= 0 ? 12 : -12);
        const z = iz * 21 + (iz >= 0 ? 9 : -9);
        const height = 8 + Math.random() * 30;
        const building = new THREE.Mesh(new THREE.BoxGeometry(9, height, 9), new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0.58 + Math.random() * 0.12, 0.15, 0.62 + Math.random() * 0.12),
          roughness: 0.9,
          metalness: 0.18
        }));
        building.position.set(x, height / 2, z);
        building.castShadow = true;
        building.receiveShadow = true;
        world.add(building);

        const roof = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.6, 9.4), accentMaterial.clone());
        roof.position.set(x, height + 0.4, z);
        roof.castShadow = true;
        world.add(roof);

        buildingBlocks.push({ obj: building, x, z, height });
      }
    }

    // traffic poles and lights
    const lightMaterial = new THREE.MeshStandardMaterial({ color: 0xffec93, emissive: 0x6b4d10, roughness: 0.4 });
    for (let z = -120; z <= 120; z += 30) {
      for (let x of [-26, 26]) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, 4.8, 8), new THREE.MeshStandardMaterial({ color: 0x4b5762, roughness: 0.75 }));
        pole.position.set(x, 2.4, z);
        world.add(pole);
        const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.2, 0.7), lightMaterial);
        lamp.position.set(x, 4.8, z);
        world.add(lamp);
      }
    }

    const carBodyMaterial = new THREE.MeshStandardMaterial({ color: 0x1a9fd6, roughness: 0.54, metalness: 0.42 });
    const carGlassMaterial = new THREE.MeshStandardMaterial({ color: 0x9fe7f6, roughness: 0.18, metalness: 0.35, transparent: true, opacity: 0.8 });
    const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x1d242c, roughness: 0.88 });

    function createCar(color = 0x1a9fd6, isTraffic = false) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.62, 3.5), new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.55 }));
      body.position.y = 0.72;
      body.castShadow = true;
      group.add(body);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.6, 1.6), carGlassMaterial);
      roof.position.set(0, 1.2, -0.1);
      roof.castShadow = true;
      group.add(roof);

      const bumper = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.18, 0.42), new THREE.MeshStandardMaterial({ color: 0xf0f5f7, roughness: 0.35, metalness: 0.2 }));
      bumper.position.set(0, 0.54, 1.85);
      group.add(bumper);

      for (const x of [-0.9, 0.9]) {
        for (const z of [-1.1, 1.1]) {
          const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.39, 0.39, 0.28, 18), wheelMaterial);
          wheel.rotation.z = Math.PI / 2;
          wheel.position.set(x, 0.42, z);
          wheel.castShadow = true;
          group.add(wheel);
        }
      }

      const headlightR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.12), new THREE.MeshStandardMaterial({ color: 0xf7f9d6, emissive: 0xcccc99, roughness: 0.35 }));
      headlightR.position.set(0.56, 0.72, 1.82);
      group.add(headlightR);
      const headlightL = headlightR.clone();
      headlightL.position.x = -0.56;
      group.add(headlightL);

      const tailR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.12), new THREE.MeshStandardMaterial({ color: 0xff5c5c, emissive: 0x5d1010, roughness: 0.3 }));
      tailR.position.set(0.56, 0.72, -1.82);
      group.add(tailR);
      const tailL = tailR.clone();
      tailL.position.x = -0.56;
      group.add(tailL);

      group.position.set(0, 0, isTraffic ? 0 : 0);
      return group;
    }

    const playerCar = createCar(0x1a9fd6, false);
    scene.add(playerCar);

    const trafficCars = [];
    const colors = [0xef5b57, 0xf0b130, 0x6bc46b, 0x705af3, 0xf0f2f6, 0xca5767];
    for (let i = 0; i < 7; i++) {
      const car = createCar(colors[i % colors.length], true);
      car.position.set([ -12, 0, 12 ][i % 3], 0, -25 - i * 24);
      scene.add(car);
      trafficCars.push({ car, lane: [ -12, 0, 12 ][i % 3], z: -25 - i * 24, active: true });
    }

    const state = {
      running: false,
      speed: 0,
      distance: 0,
      steer: 0,
      steerInput: 0,
      tiltValue: 0,
      gas: false,
      brake: false,
      roadTravel: 0,
      lastTime: performance.now(),
      tiltEnabled: false,
      keys: new Set(),
      crashTimer: 0,
      crash: false
    };

    function resetGame() {
      state.running = true;
      state.speed = 0;
      state.distance = 0;
      state.steer = 0;
      state.steerInput = 0;
      state.gas = false;
      state.brake = false;
      state.roadTravel = 0;
      state.crashTimer = 0;
      state.crash = false;

      playerCar.position.set(0, 0, 5);
      playerCar.rotation.set(0, 0, 0);

      trafficCars.forEach((traffic, i) => {
        traffic.z = -25 - i * 24;
        traffic.active = true;
        traffic.car.position.set(traffic.lane, 0, traffic.z);
      });
    }

    function finishRun() {
      state.running = false;
      document.getElementById('gameTitle').innerHTML = 'Jazda<br>skončila';
      document.getElementById('gameText').innerHTML = `Prešiel/a si <b>${state.distance.toFixed(1)}</b> km a dosiahol/a <b>${Math.round(state.speed)}</b> km/h. Skús to znova a vyhni sa premávke.`;
      startBtn.textContent = 'JAZDIŤ ZNOVA';
      overlay.classList.remove('hidden');
    }

    function startRun() {
      overlay.classList.add('hidden');
      resetGame();
      startBtn.textContent = 'ŠTART';
    }

    startBtn.addEventListener('click', startRun);

    async function enableTilt() {
      try {
        if (typeof DeviceOrientationEvent === 'undefined') {
          tipEl.innerHTML = '<b>TIP:</b> Nakláňanie nie je dostupné. Použi tlačidlá na obrazovke.';
          return;
        }

        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const result = await DeviceOrientationEvent.requestPermission();
          if (result !== 'granted') throw new Error('permission');
        }

        state.tiltEnabled = true;
        tipEl.innerHTML = '<b>NAKLÁŇANIE:</b> TelefoneM zatáčaš do strán.';
      } catch (e) {
        state.tiltEnabled = false;
        tipEl.innerHTML = '<b>TIP:</b> Nakláňanie nebolo povolené. Použi šípky alebo tlačidlá.';
      }
    }

    tiltEnableBtn.addEventListener('click', enableTilt);
    tiltBtn.addEventListener('click', enableTilt);

    window.addEventListener('deviceorientation', (event) => {
      if (event.gamma !== null && event.gamma !== undefined) {
        state.tiltValue = THREE.MathUtils.clamp(event.gamma / 28, -1, 1);
      }
    });

    document.querySelectorAll('[data-steer]').forEach((button) => {
      const value = Number(button.dataset.steer);
      const down = (event) => {
        event.preventDefault();
        state.steerInput = value;
        button.classList.add('active');
      };
      const up = () => {
        if (state.steerInput === value) state.steerInput = 0;
        button.classList.remove('active');
      };
      button.addEventListener('pointerdown', down);
      button.addEventListener('pointerup', up);
      button.addEventListener('pointerleave', up);
      button.addEventListener('pointercancel', up);
    });

    document.querySelectorAll('[data-pedal]').forEach((button) => {
      const pedal = button.dataset.pedal;
      const down = (e) => {
        e.preventDefault();
        button.classList.add('active');
        if (pedal === 'gas') state.gas = true;
        if (pedal === 'brake') state.brake = true;
      };
      const up = () => {
        button.classList.remove('active');
        if (pedal === 'gas') state.gas = false;
        if (pedal === 'brake') state.brake = false;
      };
      button.addEventListener('pointerdown', down);
      button.addEventListener('pointerup', up);
      button.addEventListener('pointerleave', up);
      button.addEventListener('pointercancel', up);
    });

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(key)) {
        event.preventDefault();
      }
      state.keys.add(key);
    });

    window.addEventListener('keyup', (event) => {
      state.keys.delete(event.key.toLowerCase());
    });

    function update(dt) {
      if (!state.running) {
        camera.position.lerp(new THREE.Vector3(0, 6, 12), 0.06);
        camera.lookAt(0, 1.2, -2);
        return;
      }

      const left = state.keys.has('arrowleft') || state.keys.has('a');
      const right = state.keys.has('arrowright') || state.keys.has('d');
      const accelerate = state.keys.has('arrowup') || state.keys.has('w') || state.gas;
      const brakePressed = state.keys.has('arrowdown') || state.keys.has('s') || state.brake;

      let desiredSteer = (right ? 1 : 0) - (left ? 1 : 0);
      if (state.steerInput !== 0) desiredSteer = state.steerInput;
      if (state.tiltEnabled) desiredSteer = state.tiltValue;

      state.steer = THREE.MathUtils.damp(state.steer, desiredSteer, 5.5, dt);

      if (accelerate) {
        state.speed = Math.min(190, state.speed + 90 * dt);
      } else {
        state.speed = Math.max(0, state.speed - 20 * dt);
      }

      if (brakePressed) {
        state.speed = Math.max(0, state.speed - 150 * dt);
      }

      const targetX = THREE.MathUtils.clamp(playerCar.position.x + state.steer * 11 * dt, -17, 17);
      playerCar.position.x = targetX;
      playerCar.rotation.z = THREE.MathUtils.clamp(-state.steer * 0.35, -0.52, 0.52);
      playerCar.rotation.y = -state.steer * 0.25;

      // world moves backwards to simulate driving
      state.roadTravel += state.speed * dt * 0.7;
      world.position.z = -state.roadTravel;
      world.position.x = 0;

      state.distance += (state.speed * dt) / 3600;
      speedEl.textContent = Math.round(state.speed);
      distanceEl.textContent = state.distance.toFixed(1);

      const camX = THREE.MathUtils.damp(camera.position.x, playerCar.position.x * 1.25, 3.5, dt);
      camera.position.set(camX, 5.2, 11.5);
      camera.lookAt(playerCar.position.x * 0.9, 1.2, 0);

      const playerZ = playerCar.position.z;
      for (const traffic of trafficCars) {
        if (!traffic.active) continue;
        traffic.z += state.speed * dt * 0.9;
        if (traffic.z > 40) {
          traffic.z = -120 - Math.random() * 80;
          traffic.lane = [-12, 0, 12][Math.floor(Math.random() * 3)];
          traffic.car.position.x = traffic.lane;
        }
        traffic.car.position.z = traffic.z;
        traffic.car.rotation.y = Math.PI;
        traffic.car.rotation.z = 0;

        if (Math.abs(traffic.car.position.x - playerCar.position.x) < 1.7 && Math.abs(traffic.car.position.z - playerZ) < 2.2) {
          state.crash = true;
          state.speed *= 0.35;
          state.crashTimer = 0.6;
        }
      }

      if (state.crash) {
        state.crashTimer -= dt;
        if (state.crashTimer <= 0) {
          state.crash = false;
          finishRun();
        }
      }

      // city lighting pulse
      const pulse = (Math.sin(performance.now() * 0.0015) + 1) * 0.5;
      sun.intensity = 2.2 + pulse * 1.5;
    }

    let last = performance.now();
    function animate(now) {
      const dt = Math.min((now - last) / 1000, 0.033);
      last = now;
      update(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
    });
  </script>
</body>
</html>
